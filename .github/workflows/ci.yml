name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: the job builds and tests, and never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    # WinUI 3 builds on Windows only; the core library and its tests would run
    # anywhere, but one job is all the checking this project needs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build AIUsageNative.slnx -c Release

      - name: Test
        run: dotnet test --project tests/UsageCore.Tests/UsageCore.Tests.csproj -c Release --no-build
