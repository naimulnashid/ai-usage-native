# Dependency updates.
#
# Weekly rather than daily, and grouped, because this is a single-maintainer
# project: a stream of one-line PRs is noise that gets ignored, and ignored
# update PRs are worse than none. Security updates arrive on their own,
# whenever an advisory is published, whatever this schedule says.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The Windows App SDK ships as several packages that are built and
      # tested together; one moving without the others is how a WinUI app ends
      # up with mismatched runtime pieces. Always one PR for all of them.
      windows-app-sdk:
        patterns:
          - 'Microsoft.WindowsAppSDK*'
      # Everything else: one PR for the safe bumps, majors on their own so
      # they get read rather than rubber-stamped.
      minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - 'Microsoft.WindowsAppSDK*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies']
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
