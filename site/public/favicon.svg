<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI Usage Dashboard">
  <!-- True-black tile so the mark keeps its own ground on light browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1e1e24"/>
  <!-- Ascending spend bars. Shade follows the model-colour rule: darker = costlier.
       Bars are 6 units wide with 3-unit gaps so they still read as three bars
       once the tab strip scales this to 16px. -->
  <rect x="4"  y="19" width="6" height="8"  rx="1.8" fill="#f0a184"/>
  <rect x="13" y="12" width="6" height="15" rx="1.8" fill="#d97757"/>
  <rect x="22" y="6"  width="6" height="21" rx="1.8" fill="#a4502f"/>
</svg>
